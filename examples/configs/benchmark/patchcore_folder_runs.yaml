# Queue explicitly listed PatchCore parameter sets on a custom Folder dataset.
#
# Run with:
#   anomalib benchmark --config examples/configs/benchmark/patchcore_folder_runs.yaml
#
# Unlike `grid:` (which expands into the cartesian product of all values), every entry
# under `runs` is one parameter set. They are executed one after the other and each one
# saves its own metrics to <output_dir>/<name>/results.csv.
#
# Keys next to `runs` (seed, model, data below) are defaults that each run inherits and
# can override; a run may still use `grid:` internally.

accelerator: cuda
benchmark:
  output_dir: runs/patchcore_folder
  seed: 42
  model:
    class_path: anomalib.models.Patchcore
    init_args:
      backbone: resnet50
      layers: [layer1, layer2]
      pre_trained: true
      coreset_sampling_ratio: 0.1
      num_neighbors: 5
      feature_pool_size: 3
      blur_sigma: 4
      # Equivalent of Patchcore.configure_pre_processor(image_size=(256, 320))
      pre_processor:
        class_path: anomalib.pre_processing.PreProcessor
        init_args:
          transform:
            class_path: torchvision.transforms.v2.Compose
            init_args:
              transforms:
                - class_path: torchvision.transforms.v2.Resize
                  init_args:
                    size: [256, 320]
                    antialias: true
                - class_path: torchvision.transforms.v2.Normalize
                  init_args:
                    mean: [0.485, 0.456, 0.406]
                    std: [0.229, 0.224, 0.225]
  data:
    class_path: anomalib.data.Folder
    init_args:
      name: my_dataset
      root: ./datasets/my_dataset
      normal_dir: train/good
      abnormal_dir: test/ng
      mask_dir: ground_truth/ng
      normal_test_dir: test/good
      extensions: null
      train_batch_size: 32
      eval_batch_size: 32
      num_workers: 8
      test_split_mode: from_dir
      test_split_ratio: 0
      val_split_mode: same_as_test
      seed: 42

  runs:
    # -> runs/patchcore_folder/resnet50_l12/results.csv
    - name: resnet50_l12
      model:
        init_args:
          backbone: resnet50
          layers: [layer1, layer2]
          coreset_sampling_ratio: 0.1

    # -> runs/patchcore_folder/wide_resnet50_l23/results.csv
    - name: wide_resnet50_l23
      model:
        init_args:
          backbone: wide_resnet50_2
          layers: [layer2, layer3]
          coreset_sampling_ratio: 0.05

    # -> runs/patchcore_folder/resnet18_bigger_batch/results.csv
    - name: resnet18_bigger_batch
      model:
        init_args:
          backbone: resnet18
          layers: [layer2, layer3]
      data:
        init_args:
          train_batch_size: 8
          eval_batch_size: 8
