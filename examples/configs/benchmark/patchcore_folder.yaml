# Queue multiple PatchCore runs on a custom Folder dataset.
#
# Run with:
#   anomalib benchmark --config examples/configs/benchmark/patchcore_folder.yaml
#
# Every value can be replaced by `grid: [...]`. All grids are expanded into their
# cartesian product and the resulting jobs are executed one after another (serially
# on CPU/single GPU, one process per GPU when several are available). Metrics of all
# runs are written to runs/benchmark/<timestamp>/results.csv.

accelerator: cuda
benchmark:
  seed: 42
  model:
    class_path: anomalib.models.Patchcore
    init_args:
      backbone:
        grid: [resnet50, wide_resnet50_2]
      layers:
        grid:
          - [layer1, layer2]
          - [layer2, layer3]
      pre_trained: true
      coreset_sampling_ratio:
        grid: [0.05, 0.1]
      num_neighbors: 5
      feature_pool_size: 3
      blur_sigma: 4
      # Equivalent of Patchcore.configure_pre_processor(image_size=(256, 320))
      pre_processor:
        class_path: anomalib.pre_processing.PreProcessor
        init_args:
          transform:
            class_path: torchvision.transforms.v2.Compose
            init_args:
              transforms:
                - class_path: torchvision.transforms.v2.Resize
                  init_args:
                    size: [256, 320]
                    antialias: true
                - class_path: torchvision.transforms.v2.Normalize
                  init_args:
                    mean: [0.485, 0.456, 0.406]
                    std: [0.229, 0.224, 0.225]
  data:
    class_path: anomalib.data.Folder
    init_args:
      name: my_dataset
      root: ./datasets/my_dataset
      normal_dir: train/good
      abnormal_dir: test/ng
      mask_dir: ground_truth/ng
      normal_test_dir: test/good
      extensions: null
      train_batch_size: 32
      eval_batch_size: 32
      num_workers: 8
      test_split_mode: from_dir
      test_split_ratio: 0
      val_split_mode: same_as_test
      seed: 42
